name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/apigw-tester

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Builds the production image on every push. Pushes to ghcr.io
  # under the current ref's sha tag; additionally tags 'latest' for main
  # and the ref's semver for version tags.
  image:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Extract image tags
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "short=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "latest=${{ github.ref_name == 'main' && 'latest' || github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "short=sha-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "latest=latest" >> $GITHUB_OUTPUT
          else
            echo "short=sha-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "latest=sha-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile.app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.short }}
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the pushed image
        run: |
          IMAGE="${IMAGE_NAME}:${{ steps.tag.outputs.short }}"
          echo "smoking $IMAGE"
          docker rm -f apigw-tester-ci || true
          docker run -d --name apigw-tester-ci \
            -e APP_BASIC_AUTH=ci:ci-test-pass \
            -p 18080:8080 "$IMAGE"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/health || true)
            if [ "$code" = "200" ]; then break; fi
            if [ "$i" = "60" ]; then
              docker logs apigw-tester-ci; exit 1
            fi
            sleep 2
          done
          # unauthorised requests must be rejected
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/summary)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/pets)"    = "401"
          # authorized request works
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-test-pass http://127.0.0.1:18080/api/summary)" = "200"
          # start a small run so the metrics pipeline really flows
          curl -s -u ci:ci-test-pass -X POST http://127.0.0.1:18080/api/run/start \
            -H "Content-Type: application/json" -d '{}' > /dev/null
          sleep 15
          total=$(curl -s -u ci:ci-test-pass "http://127.0.0.1:18080/api/summary?window=5m" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).total))")
          echo "total=$total"
          test "$total" -gt 50
          docker rm -f apigw-tester-ci
