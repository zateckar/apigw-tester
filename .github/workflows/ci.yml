name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/apigw-tester

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx eslint .
      - run: npm run typecheck
      - run: bun test packages/app/src
      # the image build compiles the UI; make sure that path works on PRs too
      - run: npm run build

  # Builds the production image on every push. Pushes to ghcr.io under the
  # current ref's sha tag; also tags 'latest' for main and for version tags.
  image:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            PRIMARY="${{ github.ref_name }}"      # e.g. v1.2.3
            EXTRA="latest"                        # a release updates :latest
          elif [ "${{ github.ref_name }}" = "main" ]; then
            PRIMARY="sha-${{ github.sha }}"
            EXTRA="latest"
          else
            PRIMARY="sha-${{ github.sha }}"
            EXTRA=""
          fi
          echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${PRIMARY}"
            [ -n "$EXTRA" ] && echo "${IMAGE_NAME}:${EXTRA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the pushed image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}:${{ steps.tag.outputs.primary }}"
          echo "smoking $IMAGE"
          docker run -d --name apigw-tester-ci \
            -e APP_BASIC_AUTH=ci:ci-test-pass \
            -p 18080:8080 "$IMAGE"
          BASE=http://127.0.0.1:18080
          AUTH=(-u ci:ci-test-pass)

          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/health" || true)
            if [ "$code" = "200" ]; then break; fi
            if [ "$i" = "60" ]; then docker logs apigw-tester-ci; exit 1; fi
            sleep 2
          done

          # The server must not run as root. Check PID 1 itself, not `docker exec
          # id -u`: exec sessions inherit the image's USER, and the entrypoint
          # deliberately starts as root to chown /app/data before su-exec'ing
          # down to `bun`. /proc/1 is owned by the uid the process runs as.
          pid1_uid=$(docker exec apigw-tester-ci awk '/^Uid:/{print $2}' /proc/1/status)
          test -n "$pid1_uid" && test "$pid1_uid" != "0"

          # unauthorised requests must be rejected
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/summary")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/pets")"    = "401"
          # authorized request works
          test "$(curl -s -o /dev/null -w '%{http_code}' "${AUTH[@]}" "$BASE/api/summary")" = "200"

          # health identifies the build, and security headers are present on every response
          curl -sf "$BASE/health" -o /tmp/health.json
          grep -q '"version"' /tmp/health.json
          hdrs=$(curl -sD - -o /dev/null "$BASE/health")
          for h in "content-security-policy" "x-content-type-options" "x-frame-options" "referrer-policy"; do
            echo "$hdrs" | grep -qi "^$h:" || { echo "missing header $h"; echo "$hdrs"; exit 1; }
          done
          # note: `grep ... && { exit 1; }` would trip `set -e` on the healthy path
          if echo "$hdrs" | grep -qi "^x-powered-by:"; then echo "x-powered-by leaked"; exit 1; fi
          echo "non-root, versioned health, security headers ok"

          # published contract definitions are downloadable and well-formed
          curl -sf "${AUTH[@]}" "$BASE/api/definitions/openapi.json" -o /tmp/openapi.json
          node -e "const d=require('/tmp/openapi.json');
            if(d.openapi!=='3.0.3') throw new Error('bad openapi version '+d.openapi);
            for(const p of ['/api/pets','/api/pets/{petId}','/api/echo','/api/big/{size}'])
              if(!d.paths[p]) throw new Error('missing path '+p);
            console.log('openapi ok:',Object.keys(d.paths).length,'paths');"
          # download before asserting: piping curl into head/grep lets the reader
          # close the pipe first, and curl then exits 23 ("failed writing body"),
          # which pipefail turns into a failed step even though the fetch was fine
          curl -sf "${AUTH[@]}" "$BASE/api/definitions/openapi.yaml" -o /tmp/openapi.yaml
          grep -q "^openapi:" /tmp/openapi.yaml   # root key, only ever at column 0
          curl -sf "${AUTH[@]}" "$BASE/api/definitions/petservice.wsdl" -o /tmp/petservice.wsdl
          grep -q "PetServicePortType" /tmp/petservice.wsdl
          # the service location really was substituted in the built image
          if grep -q "__SERVICE_LOCATION__" /tmp/petservice.wsdl; then echo "WSDL placeholder not filled"; exit 1; fi

          # drive a short run with a deliberate slice of contract violations.
          # durationMinutes makes the run end itself — nothing below sends a stop.
          curl -s "${AUTH[@]}" -X PUT "$BASE/api/config/profile" \
            -H "Content-Type: application/json" \
            -d '{"mode":"constant","rps":25,"maxConcurrency":30,"soapRatioPct":25,"invalidRatioPct":10,"durationMinutes":0.33,
                 "scenarioWeights":{"listPets":40,"getPet":20,"createPet":15,"updatePet":10,"deletePet":5,"placeOrder":10}}' > /dev/null
          RUN_ID="$(curl -s "${AUTH[@]}" -X POST "$BASE/api/run/start" -H "Content-Type: application/json" -d '{}' | node -e "
            let b='';process.stdin.on('data',d=>b+=d).on('end',()=>console.log(JSON.parse(b).runId))")"
          echo "run: $RUN_ID"
          sleep 30
          curl -sf "${AUTH[@]}" "$BASE/api/run/status" -o /tmp/status.json
          node -e "const s=require('/tmp/status.json');
            if(s.state==='running') throw new Error('durationMinutes did not stop the run: '+s.state);
            console.log('run auto-stopped, state',s.state);"

          curl -sf "${AUTH[@]}" "$BASE/api/summary?window=15m" -o /tmp/summary.json
          node -e "const s=require('/tmp/summary.json');
            console.log('total',s.total,'errors',s.errors,'contract',JSON.stringify(s.contract));
            if(!(s.total>50)) throw new Error('metrics did not flow: total='+s.total);
            // per-endpoint totals must reconcile with the headline (double-count regression)
            const sum=s.perEndpoint.reduce((a,e)=>a+e.total,0);
            if(sum!==s.total) throw new Error('perEndpoint sum '+sum+' != total '+s.total);
            const cls=s.perClass.reduce((a,c)=>a+c.total,0);
            if(cls!==s.total) throw new Error('perClass sum '+cls+' != total '+s.total);
            // the invalid slice must have been generated and rejected by the SUT
            if(!(s.contract.invalidSent>0)) throw new Error('no invalid traffic generated');
            if(s.contract.wronglyAccepted>0) throw new Error('SUT accepted '+s.contract.wronglyAccepted+' invalid requests');
            // no gateway in front here, so every invalid request MUST have
            // reached the backend. A non-zero rejectedByGateway would mean the
            // X-Server-Ms attribution is crediting the wrong party.
            if(s.contract.rejectedByGateway>0)
              throw new Error('no gateway configured, yet '+s.contract.rejectedByGateway+' rejections credited to one');
            if(s.contract.leakedToBackend!==s.contract.invalidSent)
              throw new Error('invalid traffic did not all reach the backend: '+JSON.stringify(s.contract));
            // the status dimension must be populated and reconcile
            const st=s.status, byBucket=st.buckets.reduce((a,b)=>a+b.count,0);
            if(byBucket!==s.total) throw new Error('status buckets '+byBucket+' != total '+s.total);
            if(!(st.ok>0)) throw new Error('no successful responses recorded');
            if(st.gatewayErrors>0) throw new Error('gateway faults against the built-in SUT: '+st.gatewayErrors);
            // and the valid majority must not be erroring. unexpectedFailurePct
            // excludes the deliberate invalid slice, so a 10% invalid ratio
            // must not by itself push this over the bar.
            if(s.errorPct>5) throw new Error('error rate too high: '+s.errorPct);
            if(s.unexpectedFailurePct>5) throw new Error('failure rate too high: '+s.unexpectedFailurePct);
            // the validity block must be populated, or every number above is
            // being reported without the caveat that makes it trustworthy
            const v=s.validity;
            if(typeof v.shedPct!=='number'||typeof v.achievedRps!=='number')
              throw new Error('no validity block: '+JSON.stringify(v));
            if(v.ok!==(v.reasons.length===0)) throw new Error('validity.ok disagrees with its reasons');
            console.log('validity',JSON.stringify(v));
            console.log('metrics reconcile; status dimension and contract attribution observed');"

          # policy probes: with no gateway in front, the honest answer is that
          # nothing was measured — not a pass for the bundled petstore
          curl -s "${AUTH[@]}" -X PUT "$BASE/api/policy" -H "Content-Type: application/json" \
            -d '{"enabled":true,"intervalSec":900,"required":["rate-limit"]}' > /dev/null
          curl -s "${AUTH[@]}" -X POST "$BASE/api/policy/run" > /dev/null
          sleep 5
          curl -sf "${AUTH[@]}" "$BASE/api/policy" -o /tmp/policy.json
          node -e "const p=require('/tmp/policy.json');
            if(p.results.length!==8) throw new Error('expected 8 probes, got '+p.results.length);
            const wrong=p.results.filter(r=>r.state!=='error');
            if(wrong.length) throw new Error('probes claimed a verdict with no gateway: '+JSON.stringify(wrong.map(r=>r.id)));
            console.log('policy probes reported not-measured for all',p.results.length,'checks');"

          # the per-run report, its verdict, and the redaction that makes it shareable
          curl -sf "${AUTH[@]}" "$BASE/api/runs/$RUN_ID/report" -o /tmp/report.json
          node -e "const r=require('/tmp/report.json');
            if(r.runId!=='$RUN_ID') throw new Error('report is for the wrong run: '+r.runId);
            if(!['pass','fail','inconclusive'].includes(r.verdict.state)) throw new Error('bad verdict: '+r.verdict.state);
            if(r.verdict.state==='fail'&&!r.verdict.reasons.length) throw new Error('a failing verdict with no reason');
            // rate-limit was marked required and there is no gateway to enforce
            // it, so a pass here would be a green tick over an unasked question
            if(r.verdict.state==='pass') throw new Error('reported a pass with no gateway in the path');
            if(JSON.stringify(r).includes('apiKey\":\"')&&r.gateway.rest.apiKey&&r.gateway.rest.apiKey!=='[redacted]')
              throw new Error('report leaked an api key');
            console.log('report verdict:',r.verdict.state,JSON.stringify(r.verdict.reasons));"
          curl -sf "${AUTH[@]}" "$BASE/api/runs/$RUN_ID/report.md" -o /tmp/report.md
          grep -q "# Gateway test report" /tmp/report.md
          grep -q "## Measurement validity" /tmp/report.md
          test "$(curl -s -o /dev/null -w '%{http_code}' "${AUTH[@]}" "$BASE/api/runs/no-such-run/report")" = "404"

          # every recorded request carries a correlation id, so a row in the
          # dashboard can be found again in a gateway's own access log
          curl -sf "${AUTH[@]}" "$BASE/api/recent?limit=50" -o /tmp/recent.json
          node -e "const r=require('/tmp/recent.json').items;
            if(!(r.length>0)) throw new Error('no recent requests recorded');
            const bad=r.filter(x=>!/^[0-9a-f]{32}\$/.test(x.requestId||''));
            if(bad.length) throw new Error(bad.length+' rows without a usable request id');
            if(new Set(r.map(x=>x.requestId)).size!==r.length) throw new Error('duplicate request ids');
            if(!r.some(x=>x.reachedBackend)) throw new Error('nothing marked as backend-reached');
            console.log('correlation ids ok:',r.length,'rows');"

          # a hostile range must be clamped, not OOM the process
          curl -sf "${AUTH[@]}" "$BASE/api/timeseries?bucket=60&from=0&to=$(date +%s)000" -o /tmp/ts.json
          node -e "const t=require('/tmp/ts.json');
            if(t.points.length>10000) throw new Error('timeseries not clamped: '+t.points.length);
            console.log('timeseries clamped to',t.points.length,'points');"
          test "$(curl -s -o /dev/null -w '%{http_code}' "${AUTH[@]}" "$BASE/api/recent?limit=-1")" = "400"

          # still alive after all that
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/health")" = "200"

      - name: Container logs
        if: always()
        run: docker logs apigw-tester-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f apigw-tester-ci || true
