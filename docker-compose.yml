name: apigw-tester

services:
  app:
    build:
      context: .
      dockerfile: ops/Dockerfile.app
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /app/data/metrics.db
      PETSTORE_SELF_URL: http://127.0.0.1:8080
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  app-data:
